server {
    listen 80 default_server;
    server_name skillaz-digests.ru www.skillaz-digests.ru _;
    root /var/www/digest;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Админка — только по HTTPS: там пароль и сессионная кука.
    # До миграции домена сертификат самоподписанный (см. README) —
    # браузер один раз попросит подтвердить исключение для IP сервера.
    location /admin/ {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name skillaz-digests.ru www.skillaz-digests.ru _;
    root /var/www/digest;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/digest-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/digest-selfsigned.key;

    location / {
        try_files $uri $uri/ =404;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
